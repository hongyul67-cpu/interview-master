<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>면접 마스터</title>
<!-- 수업용 「모두 같은 문제」 — 다른 공용 스크립트보다 먼저 -->
<script src="https://hongyul67-cpu.github.io/links/fixorder.js"></script>
<style>
  :root{
    --bg:#f5f6f8; --card:#fff; --line:#e2e5ea; --tx:#1c2430; --dim:#6b7684;
    --pri:#2563eb; --ok:#12a150; --no:#e5484d; --warn:#f5a524;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--tx);
       font:15px/1.65 "Pretendard","맑은 고딕",system-ui,sans-serif}
  .wrap{max-width:880px;margin:0 auto;padding:16px 14px 90px}

  header{display:flex;align-items:baseline;gap:10px;margin:6px 0 14px;flex-wrap:wrap}
  header h1{font-size:20px;margin:0;font-weight:800}
  header .sub{color:var(--dim);font-size:13px}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:9px 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);
       cursor:pointer;font-weight:700;font-size:14px;color:var(--dim)}
  .tab.on{background:var(--pri);border-color:var(--pri);color:#fff}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:16px 18px;margin-bottom:12px}
  .card h3{margin:0 0 8px;font-size:16px}
  .card .body{color:#333}
  .kw{background:#eef4ff;color:#1d4ed8;border-radius:6px;padding:1px 6px;font-weight:700}
  .bad{background:#fdeeee;color:#b4292d;border-radius:6px;padding:1px 6px;font-weight:700}

  .btn{border:1px solid var(--line);background:var(--card);border-radius:10px;
       padding:10px 16px;font-weight:700;cursor:pointer;font-size:14px;color:var(--tx)}
  .btn-primary{background:var(--pri);border-color:var(--pri);color:#fff}
  .btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .btn-warn{background:var(--warn);border-color:var(--warn);color:#4a3000}
  .btn-no{background:var(--no);border-color:var(--no);color:#fff}
  .btn:disabled{opacity:.5;cursor:default}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

  .qnum{color:var(--dim);font-size:13px;font-weight:700}
  .qtext{font-size:18px;font-weight:700;margin:6px 0 12px;line-height:1.55}
  .explain{background:#f8fafc;border-left:3px solid var(--pri);border-radius:0 8px 8px 0;
           padding:10px 14px;margin-top:10px;color:#334}
  .explain.warnbox{border-left-color:var(--warn);background:#fffaf0}
  .progress{height:8px;background:#e8ebf0;border-radius:99px;overflow:hidden;margin:10px 0 16px}
  .progress > i{display:block;height:100%;background:var(--pri);width:0;transition:width .25s}

  .empty{color:var(--dim);text-align:center;padding:34px 10px}
  .score{font-size:34px;font-weight:900;letter-spacing:-1px}
  .muted{color:var(--dim);font-size:13px}
  .pill{display:inline-block;background:#eef1f5;border-radius:99px;padding:2px 10px;
        font-size:12px;font-weight:700;color:var(--dim)}
  .pill.hot{background:#fdeeee;color:#b4292d}
  .pill.soon{background:#fff4e0;color:#8a5a00}

  /* 기관 고르기 */
  .picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
  .pick{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;
        cursor:pointer;text-align:left}
  .pick:hover{border-color:var(--pri)}
  .pick b{display:block;font-size:15px;margin-bottom:4px}
  .pick span{color:var(--dim);font-size:12.5px;line-height:1.5}

  /* 기업별 준비 */
  .grp{margin:18px 0 8px;font-size:15px;font-weight:800}
  .grp .muted{font-weight:400}
  .of{padding:10px 0;border-top:1px solid var(--line)}
  .of:first-of-type{border-top:0}
  .of h4{margin:0 0 3px;font-size:13.5px;color:var(--pri)}
  .of.about{background:#f8fafc;border:0;border-radius:10px;padding:12px 14px;margin-bottom:6px}
  details.qs summary{cursor:pointer;font-weight:700}
  details.qs ol{margin:10px 0 0;padding-left:22px}
  details.qs li{margin:6px 0}
  .sub{display:flex;gap:6px;margin:0 0 12px}
  .sub .btn.on{background:var(--tx);border-color:var(--tx);color:#fff}
  .gain{background:#fff8e6;border:2px solid var(--warn);border-radius:12px;padding:12px 14px;margin:8px 0 6px}
  .gain h4{margin:0 0 6px;font-size:14.5px;color:#8a5a00}
  .gain .best{font-size:15px;margin-bottom:6px}
  .gain .raw{font-size:13.5px;color:#4a4a4a;border-top:1px dashed #efd49a;padding-top:6px}
  .gchip{display:inline-block;background:#fff4e0;color:#8a5a00;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700;margin-top:4px}
  .crow{display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid var(--line);cursor:pointer}
  .crow:first-child{border-top:0}
  .crow:hover .cn{color:var(--pri);text-decoration:underline}
  .crow .cn{flex:1;min-width:0}
  .crow .cp{font-weight:700;text-align:right;max-width:55%}
  .lv{display:inline-block;min-width:62px;text-align:center;border-radius:6px;padding:1px 6px;font-size:11.5px;font-weight:800;flex:none}
  .lv.big{background:#12a150;color:#fff} .lv.mid{background:#dff3e7;color:#0b7a3b}
  .lv.low{background:#eef1f5;color:#6b7684} .lv.must{background:#2563eb;color:#fff}
  .lv.no{background:#fdeeee;color:#b4292d}
  @media (max-width:520px){ .crow{flex-wrap:wrap} .crow .cp{max-width:none;text-align:left;width:100%;padding-left:70px;font-size:13.5px} }

  /* 타이머 */
  .timer{font-size:40px;font-weight:900;letter-spacing:-1px;font-variant-numeric:tabular-nums}
  .timer.over{color:var(--no)}
  .tbar{height:10px;background:#e8ebf0;border-radius:99px;overflow:hidden;margin:8px 0 4px}
  .tbar > i{display:block;height:100%;background:var(--ok);width:0}
  .tbar > i.over{background:var(--no)}
  .memo{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
        font:14px/1.6 inherit;resize:vertical}

  /* 달력 */
  .lbl{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;font-weight:700;margin-right:4px}
  .lbl.g{background:#eef4ff;color:#1d4ed8}   /* 공무원 */
  .lbl.p{background:#eafaf1;color:#0b7a3b}   /* 공기업 */
  .lbl.c{background:#fff4e0;color:#8a5a00}   /* 대기업·중견 */
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>면접 마스터</h1>
    <span class="sub" id="hdSub"></span>
  </header>

  <div class="tabs">
    <button class="tab on" data-view="learn">📖 배우기</button>
    <button class="tab"    data-view="org">🏢 기업별 준비</button>
    <button class="tab"    data-view="mock">🎤 모의 면접</button>
    <button class="tab"    data-view="cal">📅 채용 달력</button>
    <button class="tab"    data-view="weak">📕 내 약점 노트</button>
  </div>

  <div id="view"></div>
</div>

<script>
/* ══════════════════════════════════════════════════════════════
   면접 마스터 — 고졸 공무원·공기업·대기업 면접 준비
   규약: https://github.com/hongyul67-cpu/links/blob/master/CONVENTIONS.md

   자료 출처 : 취업지원부 「공무원 공기업 공유.xlsx」 (실제 기출 면접 기록)
   고칠 곳은 LEARN / SETS / QUESTIONS / ORG / CAL 다섯 곳입니다.
   ══════════════════════════════════════════════════════════════ */

/* ── 1) 배우기 — 정답(모범 답변의 뼈대)을 다 보여 주는 단계 ── */
const LEARN = [
  { unit:'들어가기', t:'면접은 “말솜씨”가 아니라 “준비된 재료”로 봅니다', body:
    '면접관이 보는 것은 세 가지뿐입니다. ' +
    '<span class="kw">① 이 학생이 우리 일을 아는가</span> · ' +
    '<span class="kw">② 사고 없이 규정대로 일할 사람인가</span> · ' +
    '<span class="kw">③ 조직에서 버텨낼 사람인가</span>.<br><br>' +
    '그래서 준비는 말 연습이 아니라 <b>재료 모으기</b>부터 시작합니다. ' +
    '내 실습·동아리·아르바이트·학급 활동에서 위 세 가지를 보여 줄 장면을 각각 2개씩 찾아 두면, ' +
    '질문이 어떻게 바뀌어도 그 재료를 꺼내 쓰면 됩니다.' },

  { unit:'답변의 뼈대', t:'STAR — 경험 질문은 이 순서로만 말합니다', body:
    '“경험을 말해 보세요” 계열 질문은 전부 이 네 칸을 채우면 됩니다.<br><br>' +
    '<b>S 상황</b> 언제, 어디서, 무슨 일이었나 (1문장)<br>' +
    '<b>T 과제</b> 내가 해결해야 했던 것은 무엇이었나 (1문장)<br>' +
    '<b>A 행동</b> <span class="kw">내가</span> 무엇을 했나 — 여기가 제일 길어야 합니다 (3~4문장)<br>' +
    '<b>R 결과</b> 그래서 어떻게 됐고, 무엇을 배웠나 (1~2문장)<br><br>' +
    '<span class="bad">가장 흔한 실패</span> — A(행동)를 “열심히 했습니다”로 한 줄 때우고 ' +
    'S(상황) 설명만 길게 하는 것입니다. 면접관은 <b>네가 무엇을 했는지</b>만 궁금합니다.' },

  { unit:'답변의 뼈대', t:'만능 3종 세트 — 이것만 있으면 공기업 면접 절반은 막습니다', body:
    '공기업·공무원 면접과 자기소개서는 결국 이 세 가지를 돌려 묻습니다. ' +
    '각각 <b>내 경험 한 개씩</b>을 STAR로 미리 써 두세요.<br><br>' +
    '<b>① 안전 규정을 지킨 경험</b><br>' +
    '실습 중 보안경·장갑·차단기 확인을 빠뜨린 친구를 멈춰 세웠거나, 급해도 절차를 지킨 일.<br>' +
    '<b>② 갈등을 중재한 경험</b><br>' +
    '내 주장을 굽히고 먼저 들어 준 덕에 결과가 더 좋아진 일. (내가 리더가 아니어도 됩니다)<br>' +
    '<b>③ 기존 방식을 개선한 경험</b><br>' +
    '공구 배치를 바꿔 작업 시간을 줄였거나, 측정 순서를 정해 불량을 줄인 일.<br><br>' +
    '도로공사·동서발전·석유공사처럼 <b>필기 합격 뒤에 자소서를 쓰는</b> 기관도 많습니다. ' +
    '그때 급하게 짜면 늦습니다.' },

  { unit:'상황 면접', t:'“효율이냐 안전이냐” 물으면 답은 하나입니다', body:
    '코레일·가스안전공사·발전사 같은 곳의 상황 면접은 거의 전부 이 구조입니다. ' +
    '<b>선배(또는 상사)가 매뉴얼을 건너뛰자고 한다. 지키면 늦어지고 민원이 생긴다.</b><br><br>' +
    '답의 순서를 이렇게 고정하세요.<br>' +
    '<b>1) 결론 먼저</b> — “<span class="kw">안전이 우선입니다.</span>” 망설이면 감점입니다.<br>' +
    '<b>2) 근거는 크기 비교로</b> — 열차 지연 민원과 인명 사고는 비교 대상이 아니라고 말합니다.<br>' +
    '<b>3) 선배를 존중하며 설득</b> — “선배님, 이 구간은 곡선이라 육안 확인이 안 됩니다. ' +
    '제가 감시원을 맡겠습니다.” <b>내가 그 일을 하겠다</b>고 자원하는 게 핵심입니다.<br>' +
    '<b>4) 효율 대안을 반드시 하나 붙입니다</b> — “작업 전에 도면을 숙지하고 공구를 미리 세팅해 두어 ' +
    '본 작업 시간을 줄이겠습니다.”<br><br>' +
    '<span class="bad">주의</span> 4번을 빼면 “융통성 없는 학생”으로 보입니다. ' +
    '안전은 타협하지 않으면서 시간은 다른 데서 줄인다 — 이 두 개가 한 세트입니다.' },

  { unit:'상황 면접', t:'꼬리질문은 “내 책임”을 묻는 쪽으로 옵니다', body:
    '실제로 나온 꼬리질문입니다. 미리 답을 정해 두세요.<br><br>' +
    '· “감시원을 안 두면 <b>구체적으로 어떤 사고</b>가 나나?” → 접근 열차를 못 보고 선로 위에 남는 상황을 말합니다.<br>' +
    '· “선배들은 <b>왜</b> 안 지킨다고 생각하나?” → 선배를 욕하지 않습니다. ' +
    '“오래 사고가 없어 위험에 익숙해지신 것 같다”처럼 <b>사람이 아니라 상황</b>을 지적합니다.<br>' +
    '· “사고 나면 <b>당신에게도 책임</b>이 있나?” → “있습니다”라고 인정합니다. ' +
    '알면서 따라간 것도 책임이라고 답하는 쪽이 훨씬 좋은 평가를 받습니다.<br>' +
    '· “<b>상사가 직접</b> 무시하라고 해도?” → 결론은 그대로 유지하되, ' +
    '“보고 체계를 지켜 상급자나 안전 담당에게 확인받겠다”는 <b>절차</b>를 덧붙입니다.' },

  { unit:'약점 방어', t:'출결·성적·거리 — 변명하면 떨어집니다', body:
    '엠코테크놀로지·신도리코 같은 곳은 <b>생활기록부 출결을 한 줄씩 짚어</b> 묻습니다. ' +
    '삼성전자는 성적이 낮은 과목을, KAI는 사천 근무 거리를 묻습니다.<br><br>' +
    '공식은 하나입니다. <span class="kw">인정 → 원인 → 지금 하고 있는 조치</span><br><br>' +
    '· <b>지각·결석</b> “관리가 부족했던 게 맞습니다. 이후 알람을 3개로 나눠 맞추고 ' +
    '전날 가방을 미리 싸 둡니다. 3학년 2학기에는 지각이 없습니다.”<br>' +
    '· <b>낮은 성적</b> “핑계를 대지 않겠습니다. 대신 그 과목을 보충하려고 ○○기능사를 취득했습니다.”<br>' +
    '· <b>먼 근무지</b> “기숙사(또는 수학여행·합숙) 생활을 해 봐서 타지 생활이 두렵지 않습니다.”<br><br>' +
    '<span class="bad">절대 금지</span> “집이 멀어서요”, “그때 좀 아팠어서”, “선생님이 …” — ' +
    '원인을 남에게 돌리는 순간 태도 점수가 무너집니다.' },

  { unit:'약점 방어', t:'자소서와 인성검사에 적은 것과 “반대로” 말하지 않기', body:
    '삼성전자 면접에서 실제로 나온 질문입니다. ' +
    '“자소서에는 꼼꼼하다고 썼는데 <b>인성검사에는 성격이 매우 급하다</b>고 나오네요. 왜죠?”<br><br>' +
    '긴장하면 학생들은 자기가 쓴 내용을 잊고 정반대로 답합니다. 이게 면접관에게는 ' +
    '<b>거짓말</b>로 보입니다. 그래서 면접 전날 할 일은 새 답변을 외우는 게 아니라 ' +
    '<b>내가 낸 서류를 다시 읽는 것</b>입니다.<br><br>' +
    '자소서에 쓴 프로젝트는 <span class="kw">만든 시기 · 재료 · 가공 방법 · 아쉬운 점</span>까지 ' +
    '전부 답할 수 있어야 합니다. KAI는 “돌로 만든 얼음을 어떻게 쪼갰나, 돌은 어떻게 갈았나, ' +
    '언제 만들었나, 상용화 생각은 없었나”까지 파고들었습니다.' },

  { unit:'전공 질문', t:'모르는 전공 질문이 나왔을 때', body:
    '지어내면 꼬리질문에서 반드시 무너집니다. KT&G 면접에서 통했던 방식은 이것입니다.<br><br>' +
    '<span class="kw">“정확히 알지 못합니다. 면접이 끝나면 바로 찾아보겠습니다.”</span><br>' +
    '거기서 멈추지 말고 <b>아는 것까지는 말합니다</b> — “다만 근접센서는 학교에서 다뤄 봤는데, ' +
    '물체가 닿지 않아도 감지한다는 점은 알고 있습니다.”<br><br>' +
    '그리고 학교에서 쓴 장비는 <b>기종명까지</b> 말하세요. ' +
    '“PLC를 다뤄 봤습니다”보다 “XG5000으로 프로그램을 작성했습니다”가 훨씬 강합니다.' },

  { unit:'전공 질문', t:'면접 전날 외울 단답 — 기계·전기 공통', body:
    '실제로 나온 단답형입니다. 길게 말할 필요 없이 <b>핵심 역할 한 줄</b>이면 됩니다.<br><br>' +

  const set = o.set && SETS.find(s=>s.id===o.set);

    const box = el(`<div class="card">

      <div class="muted">${set.emoji} ${set.name} 세트입니다. 답변 전략은 <b>모의 면접에서 직접 답한 뒤에</b> 공개됩니다.</div>
      <details class="qs" style="margin-top:10px">
        <summary>질문 목록 펼치기</summary>
        <ol>${qs.map(q=>`<li><span class="pill">${q.cat}</span> ${q.q}</li>`).join('')}</ol>
      </details>

      </div>
    </div>`);
    v.appendChild(box);
    $('#orgMock').onclick = ()=>goMock(set);
  }else{
    const basic = SETS.find(s=>s.id==='basic');
    v.appendChild(el(`<div class="card">
      <h3>🎤 기출 면접 질문</h3>
      <div class="muted">이 기관 전용 기출은 아직 없습니다 — <b>⭐ 기본 인성</b> 세트로 연습하세요.
      어디에 지원하든 먼저 나오는 질문들입니다.</div>
      <div class="row" style="margin-top:12px">
        <button class="btn btn-primary" id="orgMock">⭐ 기본 인성 모의 면접 하기</button>

    $('#orgMock').onclick = ()=>goMock(basic);
  }
  $('#orgBack').onclick = ()=>{ v.innerHTML=''; renderOrg(v, back||'org'); window.scrollTo(0,0); };
}

/* 다른 탭에서 모의 면접으로 넘어갈 때 — 탭 표시도 함께 옮깁니다 */
function goMock(set){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on', x.dataset.view==='mock'));
  stopTimer(); stopRec();
  window.scrollTo(0,0);
  startMock($('#view'), set);
}

/* ── 모의 면접 : 기관 고르기 ── */
function renderPicker(v){
  v.appendChild(el(`<div class="card">
    <h3>어디를 준비합니까?</h3>
    <div class="muted">기관을 고르면 그 기관의 <b>실제 면접 순서대로</b> 질문이 나옵니다.
    답변 시간을 재고, 답한 뒤에 꼬리질문과 전략을 공개합니다.</div>
  </div>`));
  const box = el('<div class="picks"></div>');
  SETS.forEach(s=>{
    const n = QUESTIONS.filter(q=>q.set===s.id).length;
    const b = el(`<button class="pick">
      <b>${s.emoji} ${s.name}</b>
      <span>${s.desc}<br>질문 ${n}개</span></button>`);
    b.onclick = ()=>startMock(v, s);
    box.appendChild(b);
  });
  v.appendChild(box);
  v.appendChild(el(`<div class="card" style="margin-top:12px">
    <h3>처음이라면</h3>
    <div class="muted">어디에 지원하든 <b>⭐ 기본 인성</b> 세트를 먼저 마스터하세요.
    그다음에 지원 기관 세트로 넘어가면 훨씬 수월합니다.</div>
  </div>`));
}

/* ── 모의 면접 시작 ── */
function startMock(v, set){
  const list = QUESTIONS.filter(q=>q.set===set.id);
  if(!list.length){ v.innerHTML=''; v.appendChild(el('<div class="empty">질문이 아직 없습니다.</div>')); return; }
  mock = { set, list, i:0, marks:[], startTime:Date.now() };
  drawHow(v);
}

/* 진행 방식 안내 — 실제 면접 구조를 먼저 보여 줍니다 */
function drawHow(v){
  v.innerHTML='';
  v.appendChild(el(`<div class="card">
    <span class="pill">${mock.set.emoji} ${mock.set.name}</span>
    <h3>면접은 이렇게 진행됩니다</h3>
    <div class="body">${mock.set.how}</div>
    <div class="explain warnbox" style="margin-top:12px">
      <b>연습 방법</b><br>
      질문이 나오면 <b>속으로 읽지 말고 실제로 소리 내어</b> 답해 보세요.
      타이머가 목표 시간을 알려 줍니다. 시간이 지나도 멈추지 않으니 끝까지 말해도 됩니다.<br>
      답을 마치면 <b>꼬리질문과 답변 전략</b>이 공개됩니다. 그때 스스로 점수를 매기면
      부족한 질문만 <b>📕 내 약점 노트</b>에 모입니다.
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn btn-primary" id="mkGo">🎤 질문 ${mock.list.length}개 시작</button>
      <button class="btn" id="mkBack">← 다른 기관</button>
    </div>
  </div>`));
  $('#mkGo').onclick   = ()=>drawQ(v);
  $('#mkBack').onclick = ()=>renderPicker(v);
}

/* 질문 화면 */
function drawQ(v){
  stopTimer(); stopRec();
  const q = mock.list[mock.i];
  v.innerHTML='';
  v.appendChild(el(`<div class="progress"><i style="width:${mock.i/mock.list.length*100}%"></i></div>`));

  const card = el(`<div class="card">
    <div class="qnum">${mock.i+1} / ${mock.list.length}
      <span class="pill" style="margin-left:6px">${q.cat}</span>
      <span class="pill" style="margin-left:2px">목표 ${q.sec}초</span></div>
    <div class="qtext">${q.q}</div>
    <div class="tbar"><i id="tb"></i></div>
    <div class="row" style="justify-content:space-between">
      <span class="timer" id="tt">0:00</span>
      <span class="muted" id="thint">소리 내어 답해 보세요</span>
    </div>
    <div class="row" style="margin-top:10px">
      <button class="btn btn-ok" id="mkDone">답변 마침 → 전략 보기</button>
      <button class="btn" id="mkRec">🎙 녹음 시작</button>
    </div>
    <div id="recBox" style="margin-top:10px"></div>
    <details style="margin-top:12px">
      <summary class="muted" style="cursor:pointer">✍️ 답변 키워드를 적어 두고 싶으면 (선택)</summary>
      <textarea class="memo" id="memo" style="margin-top:8px"
        placeholder="말할 순서만 짧게 — 예) 상황: 야간 실습 / 행동: 감시 자원 / 결과: 사고 없이 완료"></textarea>
    </details>
  </div>`);
  v.appendChild(card);

  startTimer(q.sec);
  $('#mkDone').onclick = ()=>drawTip(v);
  $('#mkRec').onclick  = ()=>toggleRec();
}

/* 타이머 — 목표 시간이 지나도 멈추지 않고 색만 바뀝니다 */
function startTimer(target){
  const t0 = Date.now();
  const paint = ()=>{
    const s = Math.floor((Date.now()-t0)/1000);
    const tt = $('#tt'), tb = $('#tb'), th = $('#thint');
    if(!tt) return stopTimer();
    tt.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
    const pct = Math.min(100, s/target*100);
    tb.style.width = pct+'%';
    if(s > target){
      tt.classList.add('over'); tb.classList.add('over');
      th.textContent = `목표 ${target}초를 넘었습니다 — 요점만 남기고 줄여 보세요`;
    }else{
      th.textContent = `목표까지 ${target-s}초`;
    }
  };
  paint();
  tick = setInterval(paint, 250);
}
function stopTimer(){ if(tick){ clearInterval(tick); tick=null; } }

/* 녹음 — 이 기기에만 남고 아무 곳에도 올라가지 않습니다 */
function toggleRec(){
  if(rec && rec.state==='recording'){ stopRec(); return; }
  if(!(navigator.mediaDevices && window.MediaRecorder)){
    $('#recBox').innerHTML = '<div class="explain warnbox">이 브라우저에서는 녹음을 쓸 수 없습니다. 휴대폰 녹음 앱을 써 주세요.</div>';
    return;
  }
  navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{
    const chunks = [];
    rec = new MediaRecorder(stream);
    rec.ondataavailable = e => chunks.push(e.data);
    rec.onstop = ()=>{
      stream.getTracks().forEach(t=>t.stop());
      const url = URL.createObjectURL(new Blob(chunks, {type:'audio/webm'}));
      const box = $('#recBox');
      if(box) box.innerHTML = `<div class="explain"><b>내 답변 다시 듣기</b> — 이 기기에만 남고 아무 곳에도 올라가지 않습니다<br>
        <audio controls src="${url}" style="width:100%;margin-top:6px"></audio></div>`;
      const b = $('#mkRec'); if(b){ b.textContent='🎙 다시 녹음'; b.classList.remove('btn-no'); }
    };
    rec.start();
    const b = $('#mkRec'); if(b){ b.textContent='⏹ 녹음 정지'; b.classList.add('btn-no'); }
  }).catch(()=>{
    $('#recBox').innerHTML = '<div class="explain warnbox">마이크를 쓸 수 없습니다. 브라우저에서 마이크를 허용했는지 확인해 주세요. 녹음 없이도 연습은 그대로 됩니다.</div>';
  });
}
function stopRec(){ try{ if(rec && rec.state==='recording') rec.stop(); }catch(e){} }

/* 꼬리질문 + 전략 공개 → 자기 점검 */
function drawTip(v){
  stopTimer(); stopRec();
  const q = mock.list[mock.i];
  const memo = ($('#memo')||{}).value || '';
  v.innerHTML='';
  v.appendChild(el(`<div class="progress"><i style="width:${(mock.i+1)/mock.list.length*100}%"></i></div>`));

  const card = el(`<div class="card">
    <div class="qnum">${mock.i+1} / ${mock.list.length} <span class="pill" style="margin-left:6px">${q.cat}</span></div>
    <div class="qtext">${q.q}</div>
    ${memo.trim() ? `<div class="explain"><b>내가 적은 키워드</b><br>${esc(memo).replace(/\n/g,'<br>')}</div>` : ''}
  </div>`);
  v.appendChild(card);

  if(q.follow && q.follow.length){
    const f = el(`<div class="card"><h3>🔗 실제로 이어서 나온 꼬리질문</h3>
      <div class="muted" style="margin-bottom:8px">여기서 무너지는 학생이 가장 많습니다. 하나씩 소리 내어 답해 보세요.</div>
      <div id="fl"></div></div>`);
    v.appendChild(f);
    q.follow.forEach((x,i)=>{
      f.querySelector('#fl').appendChild(el(`<div class="explain" style="margin-top:6px">
        <b>${i+1}.</b> ${x}</div>`));
    });
  }

  v.appendChild(el(`<div class="card"><h3>💡 답변 전략</h3><div class="body">${q.tip}</div></div>`));

  const chk = el(`<div class="card">
    <h3>스스로 점검</h3>
    <div class="muted" style="margin-bottom:10px">솔직하게 고르세요. 부족한 것만 약점 노트에 모입니다.</div>
    <div class="row">
      <button class="btn btn-ok"   data-mk="2">잘 말했다</button>
      <button class="btn btn-warn" data-mk="1">어설펐다</button>
      <button class="btn btn-no"   data-mk="0">못 했다</button>
    </div>
  </div>`);
  v.appendChild(chk);
  chk.querySelectorAll('[data-mk]').forEach(b=>{
    b.onclick = ()=>{
      const mk = +b.dataset.mk;
      mock.marks.push({q, mk});
      if(mk < 2) pushWeak(q, mk);
      mock.i++;
      if(mock.i >= mock.list.length) return finish(v);
      drawQ(v);
    };
  });
}

function pushWeak(q, mk){
  ST.weak = ST.weak.filter(w => w.q !== q.q);
  ST.weak.unshift({ set:mock.set.name, cat:q.cat, q:q.q, follow:q.follow||[], tip:q.tip, mk, at:Date.now() });
  ST.weak = ST.weak.slice(0, 100);
  save();
}

/* ── 끝난 뒤 ── */
function finish(v){
  const n   = mock.marks.length;
  const got = mock.marks.reduce((a,b)=>a+b.mk, 0);
  const pct = Math.round(got / (n*2) * 100);
  const sec = Math.round((Date.now() - mock.startTime)/1000);
  const part = mock.set.name;

  v.innerHTML = '';
  v.appendChild(el(`<div class="card" style="text-align:center">
      <div class="score">${pct}점</div>
      <div class="muted">질문 ${n}개 · ${Math.floor(sec/60)}분 ${sec%60}초<br>
        스스로 매긴 점수입니다 — 낮게 나왔다면 약점 노트가 그만큼 잘 쌓인 것입니다</div>
      <div id="rankBox" style="margin-top:12px"></div>
      <div id="rSubmitAnchor" style="margin-top:12px"></div>
    </div>`));

  const bad = mock.marks.filter(m=>m.mk<2);
  if(bad.length){
    v.appendChild(el(`<div class="card"><h3>📕 다시 연습할 질문 ${bad.length}개</h3>
      <div class="muted">아래 질문은 약점 노트에 저장됐습니다. 면접 전날 이것만 다시 보세요.</div></div>`));
    bad.forEach(m=>{
      v.appendChild(el(`<div class="card">
        <span class="pill ${m.mk===0?'hot':'soon'}">${m.mk===0?'못 했다':'어설펐다'}</span>
        <span class="pill">${m.q.cat}</span>
        <div class="qtext">${m.q.q}</div>
        <div class="explain">${m.q.tip}</div>
      </div>`));
    });
  }else{
    v.appendChild(el(`<div class="card"><h3>전부 “잘 말했다”로 체크했습니다</h3>
      <div class="muted">그렇다면 다음은 <b>녹음해서 다시 들어 보기</b>입니다.
      내가 생각한 것보다 빠르게 말하거나 “어···”가 많은 경우가 대부분입니다.</div></div>`));
  }

  v.appendChild(el(`<div class="card row">
    <button class="btn" id="again">🔁 이 기관 다시</button>
    <button class="btn" id="other">← 다른 기관</button>
  </div>`));
  $('#again').onclick = ()=>startMock(v, mock.set);
  $('#other').onclick = ()=>renderPicker(v);

  /* 제출을 먼저 붙입니다 — 연출·계급에서 오류가 나도 제출 버튼은 살아 있어야 합니다 */
  mountSubmit(pct, n, sec, part, bad);

  try{
    if(window.FX && pct>=60){
      FX.banner({ title: pct>=90?'훌륭합니다!':'통과!', sub:`${part} ${pct}점`,
                  stars: FX.starsFor ? FX.starsFor(pct) : 0 });
    }
  }catch(e){ console.warn('FX', e); }
  try{
    if(window.Rank){
      const res = Rank.award(pct, { mode:`면접 마스터 — ${part}` });
      $('#rankBox').innerHTML = Rank.resultBox(res);
    }
  }catch(e){ console.warn('Rank', e); }
}

/* ── 결과 제출 (규약 1) ── */
function mountSubmit(pct, total, sec, part, bad){
  lastResult = {
    mode   : `면접 마스터 — ${part}`,
    score  : pct, correct: total-bad.length, total,
    wrong  : bad.map(m => `${m.q.cat} · ${m.q.q.slice(0,28)}… (${m.mk===0?'못 했다':'어설펐다'})`),
    durationSec : sec,
  };
  const anchor = $('#rSubmitAnchor');
  if(!(window.ResultCollector && ResultCollector.attach) || !anchor) return;
  const btn = ResultCollector.attach(anchor, ()=>lastResult, {
    id:'rcBtn', className:'btn btn-primary',
    mode: lastResult.mode,
    extra: [`면접 마스터 ${part} 모의면접 ${pct}점`],
  });
  if(btn){ btn.style.width='100%'; btn.textContent = `📤 [${part}] 결과 제출`; }
}

/* ── 내 약점 노트 ── */
function renderWeak(v){
  if(!ST.weak.length){
    v.appendChild(el('<div class="empty">🗒️ 아직 약점이 없어요!<br>모의 면접에서 “어설펐다·못 했다”로 체크한 질문이 여기 모입니다.</div>'));
    return;
  }
  v.appendChild(el(`<div class="card row">
      <b>${ST.weak.length}개</b>
      <span class="muted">면접 전날 이것만 다시 보세요</span>
      <button class="btn" id="clrWeak" style="margin-left:auto">비우기</button></div>`));
  $('#clrWeak').onclick = ()=>{
    if(!confirm('약점 노트를 모두 비울까요?')) return;
    ST.weak=[]; save(); render('weak');
  };
  ST.weak.forEach(w=>{
    const c = el(`<div class="card">
      <span class="pill ${w.mk===0?'hot':'soon'}">${w.mk===0?'못 했다':'어설펐다'}</span>
      <span class="pill">${w.set}</span>
      <span class="pill">${w.cat}</span>
      <div class="qtext">${w.q}</div>
      <div id="wf"></div>
      <div class="explain">${w.tip}</div>
    </div>`);
    v.appendChild(c);
    (w.follow||[]).forEach((x,i)=>{
      c.querySelector('#wf').appendChild(el(`<div class="muted" style="margin:2px 0">🔗 ${x}</div>`));
    });
  });
}

$('#hdSub').textContent = `기관 ${SETS.length} · 질문 ${QUESTIONS.length} · 개념 ${LEARN.length}`;
render('learn');
</script>
